# ---------------------------------------------------------------------------
# Kitty · configuración personal
# Los colores, la barra de pestañas y la transparencia los genera DMS/matugen
# a partir del fondo de pantalla (se actualizan solos al cambiarlo).
# ---------------------------------------------------------------------------

# Tipografía (Nerd Font instalada en ~/.fonts)
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Ventana / legibilidad
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5

# Integración con shells (fish/zsh/bash)
shell_integration enabled

# DMS: pestañas + paleta + opacidad según el wallpaper
include dank-tabs.conf
include dank-theme.conf
