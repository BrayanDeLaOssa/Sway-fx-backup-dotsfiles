# =====================================================================
#  Entorno y arranque de la sesión
# =====================================================================

# Exporta el entorno para que los servicios de usuario (dms.service) funcionen.
exec dbus-update-activation-environment --systemd --all
exec dbus-update-activation-environment --systemd QT_QPA_PLATFORM=wayland QT_QPA_PLATFORMTHEME=gtk3 QT_QPA_PLATFORMTHEME_QT6=gtk3 ELECTRON_OZONE_PLATFORM_HINT=auto XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway

# Genera el archivo plano de atajos que lee el cheatsheet de DMS.
# (DMS no sigue los include de Sway; ver scripts/gen-keybinds-flat.sh)
exec_always ~/.config/sway/scripts/gen-keybinds-flat.sh

# Arranca graphical-session.target + dms.service.
# XDG_SESSION_TYPE debe estar en el entorno del user manager ANTES de que
# arranque dms.service: linux-wallpaperengine lo usa para detectar Wayland.
exec sh -c 'systemctl --user set-environment XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway && systemctl --user start sway-session.target || true'

# Autostart de apps: añade aquí las que quieras lanzar al iniciar sesión.
# exec app1
# exec app2
