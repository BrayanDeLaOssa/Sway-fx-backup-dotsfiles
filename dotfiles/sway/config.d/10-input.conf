# =====================================================================
#  Dispositivos de entrada
# =====================================================================

# Teclado: distribuciones inglés (US) y español (ES).
# Cambio de idioma: Alt+Shift. Para usar Super+Space cambia a:
#   xkb_options "grp:win_space_toggle"
input type:keyboard {
    xkb_layout "us,es"
    xkb_options "grp:alt_shift_toggle"
}

