# =====================================================================
#  Monitores / salidas
# =====================================================================
# DMS dibuja su propio wallpaper, así que no hace falta swaybg.
# Lista las salidas conectadas con: swaymsg -t get_outputs
#
# Ejemplos:
# output HDMI-A-1 resolution 1920x1080 position 0,0 scale 1
# output eDP-1 resolution 2560x1600 scale 1.25
# output DP-1 transform 90
#
# Si quisieras wallpaper propio en vez del de DMS:
# output "*" bg ~/Imágenes/wallpaper.png fill
