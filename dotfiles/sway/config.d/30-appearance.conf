# =====================================================================
#  Apariencia: fuentes, espaciado, bordes, colores y cursor
# =====================================================================

font pango:Google Sans Flex 10

# Gaps (espacio entre ventanas y con los bordes de pantalla)
gaps inner 3
gaps outer 3
smart_gaps off

# Bordes: 2 px de color para distinguir la ventana activa.
# smart_borders on -> solo se dibujan si hay más de una ventana en el workspace.
default_border pixel 2
default_floating_border pixel 2
smart_borders on

# Mover/redimensionar ventanas flotantes con $mod + arrastre
floating_modifier $mod normal

# Cursor
seat seat0 xcursor_theme "GLT_Chito (No White Border)" 24

# Colores de ventana: borde, fondo, texto, indicador, hijo urgente
client.focused          #ffffff #6750A4 #ffffff #6750A4 #ffffff
client.unfocused        #1C1B1F #1C1B1F #cac4d0 #1C1B1F #1C1B1F
client.focused_inactive #1C1B1F #1C1B1F #cac4d0 #1C1B1F #1C1B1F
client.urgent           #B3261E #B3261E #ffffff #B3261E #B3261E
