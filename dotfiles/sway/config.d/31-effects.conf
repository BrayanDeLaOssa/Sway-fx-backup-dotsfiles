# =====================================================================
#  SwayFX: efectos visuales (solo con el paquete swayfx)
# =====================================================================

### Blur suave
# En sway normal estas directivas se ignoran.
blur enable
blur_radius 4
blur_passes 2
blur_noise 0.02
blur_brightness 0.95
blur_contrast 0.95
blur_saturation 1.0
blur_xray disable

### Animaciones (estilo Hyprland)
# SwayFX 0.6+ anima de forma nativa con easing "ease-out-cubic":
#   - apertura de ventanas  -> pop-in (crecen desde el centro + fade in)
#   - cierre de ventanas    -> pop-out (se encogen al centro + fade out)
#   - mover / redimensionar -> transición suave hacia la nueva geometría
#   - cambio de workspace   -> crossfade entre el workspace viejo y el nuevo
# Valor en milisegundos (0 = desactivado, máx 5000).
# 250 ms es el recomendado por upstream. Prueba 180 (rápido) a 350 (lento).
animation_duration_ms 250

### Esquinas redondeadas + sombras (look Hyprland)
# Combínalo con los gaps y el blur para el efecto "eye candy".
corner_radius 10
smart_corner_radius enable
shadows enable
shadow_blur_radius 20
shadow_color #00000066
shadow_inactive_color #00000033
shadow_offset 0 4

### Atenuar ventanas inactivas para destacar la activa (opcional)
# Descomenta si lo quieres; 0.0 = sin atenuar, 1.0 = muy oscuro.
# default_dim_inactive 0.10
