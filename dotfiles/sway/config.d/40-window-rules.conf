# =====================================================================
#  Reglas por ventana / aplicación
# =====================================================================
# Sintaxis: for_window [criterio] comando
# Criterios habituales: app_id, class, title, instance, shell
#
# Ejemplos:
#   for_window [app_id="pavucontrol"] floating enable
#   for_window [class="Gimp"] workspace number 3
#   for_window [title=".*YouTube.*"] opacity 0.95

# DMS: ventanas flotantes (Ajustes, diálogos, etc.)
for_window [app_id="dev.duxlabs.shell"] floating enable

# Transparencia suave para VSCodium (Wayland y XWayland)
for_window [app_id="codium"] opacity 0.80
for_window [class="codium"] opacity 0.80

# Vesktop: fuerza el blur de SwayFX en la ventana transparente (Electron
# declara la superficie como opaca; opacity < 1 hace que el compositor aplique blur)
for_window [app_id="vesktop"] opacity 0.99
for_window [class="vesktop"] opacity 0.99
