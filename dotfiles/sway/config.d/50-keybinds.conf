# =====================================================================
#  Atajos generales   ($mod = Super, definido en ../config)
# =====================================================================

### Lanzadores / apps
bindsym $mod+Return      exec $term
bindsym $mod+E           exec $filemanager
bindsym $mod+B           exec $browser
bindsym $mod+D           exec dms ipc call spotlight toggle
bindsym $mod+comma       exec dms ipc call settings focusOrToggle
bindsym $mod+Shift+E     exec dms ipc call settings focusOrToggle
bindsym $mod+M           exec dms ipc call processlist focusOrToggle
bindsym $mod+Shift+N     exec dms ipc call notifications toggle
bindsym $mod+W           exec dms ipc call dash toggle wallpaper
bindsym $mod+Alt+V       exec dms ipc call clipboard toggle
bindsym $mod+Shift+slash exec dms ipc call keybinds openWithPath sway ~/.config/sway/keybinds.flat.conf

### Cerrar / salir / bloquear / recargar
bindsym $mod+Q           kill
bindsym $mod+Shift+Q     kill
bindsym Ctrl+Alt+Delete  exec swaynag -t warning -m '¿Seguro que quieres cerrar la sesión de Sway?' -B 'Sí, salir' 'swaymsg exit'
bindsym Ctrl+Alt+L       exec dms ipc call lock lock
bindsym $mod+Alt+L       exec dms ipc call lock lock
bindsym $mod+Shift+c     reload

### Ventanas: foco, orden (swap), redimensionar
# Foco: Super + flechas / hjkl
bindsym $mod+Left   focus left
bindsym $mod+Down   focus down
bindsym $mod+Up     focus up
bindsym $mod+Right  focus right
bindsym $mod+$left  focus left
bindsym $mod+$down  focus down
bindsym $mod+$up    focus up
bindsym $mod+$right focus right

# Mover / intercambiar ventana (movewindow de Hyprland) — Super + Ctrl
bindsym $mod+Ctrl+Left   move left
bindsym $mod+Ctrl+Down   move down
bindsym $mod+Ctrl+Up     move up
bindsym $mod+Ctrl+Right  move right
bindsym $mod+Ctrl+$left  move left
bindsym $mod+Ctrl+$down  move down
bindsym $mod+Ctrl+$up    move up
bindsym $mod+Ctrl+$right move right

# Redimensionar (resizeactive de Hyprland) — Super + Shift
bindsym $mod+Shift+Left   resize shrink width 10px
bindsym $mod+Shift+Right  resize grow width 10px
bindsym $mod+Shift+Up     resize shrink height 10px
bindsym $mod+Shift+Down   resize grow height 10px
bindsym $mod+Shift+$left  resize shrink width 10px
bindsym $mod+Shift+$right resize grow width 10px
bindsym $mod+Shift+$up    resize shrink height 10px
bindsym $mod+Shift+$down  resize grow height 10px

### Fullscreen / flotante / layout
bindsym $mod+Shift+F     fullscreen
bindsym $mod+Space       floating toggle
bindsym $mod+Shift+I     layout toggle split
bindsym $mod+Alt+B       splith
bindsym $mod+Shift+B     splitv
bindsym $mod+A           focus parent
bindsym $mod+grave       focus mode_toggle

### Modo resize alternativo (compatible con Sway clásico)
mode "resize" {
    bindsym $left  resize shrink width 10px
    bindsym $down  resize grow height 10px
    bindsym $up    resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Left   resize shrink width 10px
    bindsym Down   resize grow height 10px
    bindsym Up     resize shrink height 10px
    bindsym Right  resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+R mode "resize"
