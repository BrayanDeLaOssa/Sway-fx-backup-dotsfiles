# =====================================================================
#  Wallpaper Engine animado (linux-wallpaperengine + plugin de DMS)
# =====================================================================
# Gestor principal: el plugin "linuxWallpaperEngine" (por sgtaziz), que ya
# está instalado en ~/.config/dms/plugins/linuxWallpaperEngine.
#
# Por qué NO hace falta `exec_always` aquí:
#   - El plugin corre dentro de dms.service, que arranca con
#     graphical-session.target (ver config.d/00-environment.conf).
#   - `swaymsg reload` recarga Sway, no DMS: el wallpaper sigue vivo y no
#     se duplica. `exec_always` lanzaría una segunda instancia en cada
#     recarga (o competiría con el plugin al iniciar sesión).
#   - El plugin ya pasa `--layer background`, por debajo de la capa
#     "bottom" donde DMS pinta sus widgets de escritorio.
#
# Rutas correctas (Steam nativo):
#   assets:  ~/.local/share/Steam/steamapps/common/wallpaper_engine/assets
#   scenes:  ~/.local/share/Steam/steamapps/workshop/content/431960
# Configuradas en: DMS → Ajustes → Plugins → Linux Wallpaper Engine
#                  → Custom Paths (Assets Folder / Backgrounds Folder).

### Atajos
# Encender / apagar el wallpaper animado
bindsym $mod+Shift+W exec dms ipc call plugins toggle linuxWallpaperEngine
# Siguiente escena / abrir el selector de wallpapers
bindsym $mod+Ctrl+W  exec dms ipc call linuxWallpaperEngine next
bindsym $mod+Alt+W   exec dms ipc call linuxWallpaperEngine picker

### Fallback sin plugin
# Si desactivas el plugin y quieres que el script sea el único gestor,
# descomenta esta línea. Es idempotente: si ya hay un proceso en eDP-1,
# sale sin lanzar otro. También sirve para probar a mano:
#   ~/.config/sway/scripts/wallpaper-engine.sh
#   WE_SCENE=2215664988 WE_FPS=30 ~/.config/sway/scripts/wallpaper-engine.sh
# exec_always ~/.config/sway/scripts/wallpaper-engine.sh
